# Serves the built SPA and proxies /api/* to the backend container (same-origin for the browser).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Receipts are limited to 5 MB by the backend; leave headroom for multipart overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html; never cache it so new builds load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
